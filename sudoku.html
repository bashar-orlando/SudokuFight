<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9eef3;--panel:#fff;--ink:#14213d;--muted:#5b6b82;--line:#b9c4d2;--thick:#14213d;--sel:#ffd166;--peer:#e3ebf5;--same:#8fb4e8;--samefg:#0b2a5c;--bad:#d62839;--badbg:#fde4e6;--given:#14213d;--mine:#2a6fdb;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--panel:#172334;--ink:#e8eef7;--muted:#9aa9bd;--line:#2f4058;--thick:#8fa3bf;--sel:#8a6a12;--peer:#1f3047;--same:#3f6a9c;--samefg:#fff;--bad:#ff6b78;--badbg:#4a2029;--given:#e8eef7;--mine:#6ea8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1824;--panel:#172334;--ink:#e8eef7;--muted:#9aa9bd;--line:#2f4058;--thick:#8fa3bf;--sel:#8a6a12;--peer:#1f3047;--same:#3f6a9c;--samefg:#fff;--bad:#ff6b78;--badbg:#4a2029;--given:#e8eef7;--mine:#6ea8ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif}
#root{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2rem;font-weight:800;margin:4px 0 12px;letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gear{font:inherit;font-size:1.5rem;line-height:1;width:44px;height:44px;border:1.5px solid var(--thick);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;padding:0}
.gear:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
.seg.right{margin-left:auto}
.bar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;border:1.5px solid var(--thick);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.field{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem}
select{font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:1.5px solid var(--thick);border-radius:8px;padding:5px 6px}
.time{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.lives{font-weight:800;font-variant-numeric:tabular-nums}
.lives.warn{color:var(--bad)}
.board{--cell:calc(min(528px,100vw - 32px) / var(--n));display:grid;background:var(--panel);border:3px solid var(--thick);border-radius:6px;width:100%;aspect-ratio:1;touch-action:manipulation}
.board.busy{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);color:var(--mine);font:inherit;font-weight:600;font-size:calc(var(--cell) * .55);padding:0;cursor:pointer;min-width:0;overflow:hidden}
.cell.given{color:var(--given);font-weight:800}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same);color:var(--samefg)}
.cell.sel{background:var(--sel);color:#14213d}
.cell.bad{background:var(--badbg);color:var(--bad)}
.cell.sel.bad{background:var(--sel);color:var(--bad)}
.board.won .cell{background:var(--panel) !important;color:var(--mine) !important}
.board.won .cell.given{color:var(--given) !important}
.cell.rb{border-right:2.5px solid var(--thick)}
.cell.bb{border-bottom:2.5px solid var(--thick)}
.cell:focus-visible{outline:3px solid var(--mine);outline-offset:-3px;z-index:1}
.notes{display:grid;width:92%;height:92%;font-size:calc(var(--cell) * .92 / var(--nc) * .8);font-weight:600;line-height:1;align-content:stretch}
.notes span{display:flex;align-items:center;justify-content:center;opacity:.28;color:var(--muted)}
.notes span.on{opacity:1;color:var(--ink);font-weight:800}
.pad{display:grid;gap:8px;margin-top:14px}
.pad button,.tools button{font:inherit;font-weight:600;border:1.5px solid var(--thick);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 0;cursor:pointer;font-size:1.1rem}
.pad button:disabled{opacity:.3;cursor:default}
.pad button:focus-visible,.tools button:focus-visible,.seg button:focus-visible,select:focus-visible{outline:3px solid var(--mine);outline-offset:2px}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{flex:1;font-size:.95rem;padding:10px 6px;white-space:nowrap}
.tools button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--panel);border:1.5px solid var(--thick);font-weight:600}
.msg.lost{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

const DIFFS = ["Easy", "Medium", "Hard"];
const FRAC = [0.48, 0.58, 0.64];
const BR_OPTS = [2, 3, 4], BC_OPTS = [2, 3, 4, 5, 6], MAX_N = 18;
const LIMITS = [[0, "Unlimited"], [1, "1"], [2, "2"], [3, "3"], [5, "5"], [10, "10"]];
const BUDGET = { budget: true };

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (k) => Array.from({ length: k }, (_, i) => i);

function peersOf(i, { n, br, bc }) {
  const r = Math.floor(i / n), c = i % n, set = new Set();
  for (let k = 0; k < n; k++) { set.add(r * n + k); set.add(k * n + c); }
  const r0 = r - (r % br), c0 = c - (c % bc);
  for (let y = 0; y < br; y++) for (let x = 0; x < bc; x++) set.add((r0 + y) * n + c0 + x);
  set.delete(i);
  return [...set];
}

function makeEngine(cfg) {
  const { n } = cfg;
  const peers = Array.from({ length: n * n }, (_, i) => peersOf(i, cfg));
  let nodes = 0, cap = Infinity;
  const options = (g, i) => { const used = new Set(peers[i].map((p) => g[p])); const o = []; for (let v = 1; v <= n; v++) if (!used.has(v)) o.push(v); return o; };
  const pick = (g) => { let best = -1, bo = null; for (let i = 0; i < g.length; i++) if (!g[i]) { const o = options(g, i); if (!bo || o.length < bo.length) { best = i; bo = o; if (o.length < 2) break; } } return [best, bo]; };
  const count = (g, limit) => {
    if (++nodes > cap) throw BUDGET;
    const [i, o] = pick(g); if (i < 0) return 1;
    let t = 0; for (const v of o) { g[i] = v; t += count(g, limit - t); if (t >= limit) break; }
    g[i] = 0; return t;
  };
  return { peers, count, setCap: (c) => { nodes = 0; cap = c; } };
}

// Valid base grid for any br x bc boxes, then shuffled while staying valid.
function randomSolution({ n, br, bc }) {
  const bands = n / br, stacks = n / bc;
  const rows = shuffle(range(bands)).flatMap((b) => shuffle(range(br)).map((k) => b * br + k));
  const cols = shuffle(range(stacks)).flatMap((s) => shuffle(range(bc)).map((k) => s * bc + k));
  const digits = shuffle(range(n).map((d) => d + 1));
  const g = [];
  for (const r of rows) for (const c of cols) g.push(digits[(bc * (r % br) + Math.floor(r / br) + c) % n]);
  return g;
}

function generate(cfg, diff) {
  const eng = makeEngine(cfg), total = cfg.n * cfg.n;
  const sol = randomSolution(cfg), puz = sol.slice();
  const target = Math.round(total * FRAC[diff]), t0 = Date.now();
  let removed = 0;
  for (const i of shuffle(range(total))) {
    if (removed >= target || Date.now() - t0 > 3000) break;
    const keep = puz[i]; puz[i] = 0;
    let unique = false;
    try { eng.setCap(6000); unique = eng.count(puz.slice(), 2) === 1; } catch (e) { if (e !== BUDGET) throw e; }
    if (unique) removed++; else puz[i] = keep;
  }
  return { puz, sol, cfg };
}

const fmt = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function App() {
  const [br, setBr] = useState(3);
  const [bc, setBc] = useState(3);
  const [diff, setDiff] = useState(0);
  const [maxMistakes, setMaxMistakes] = useState(3);
  const [showSettings, setShowSettings] = useState(false);
  const [game, setGame] = useState(null);
  const [busy, setBusy] = useState(true);
  const [vals, setVals] = useState([]);
  const [notes, setNotes] = useState([]);
  const [sel, setSel] = useState(null);
  const [noteMode, setNoteMode] = useState(false);
  const [secs, setSecs] = useState(0);
  const [hints, setHints] = useState(0);
  const [mistakes, setMistakes] = useState(0);

  const eng = useMemo(() => (game ? makeEngine(game.cfg) : null), [game]);

  const start = () => {
    setBusy(true);
    setTimeout(() => {
      const cfg = { n: br * bc, br, bc };
      const g = generate(cfg, diff);
      setGame(g); setVals(g.puz.slice()); setNotes(Array(cfg.n * cfg.n).fill(0));
      setSel(null); setSecs(0); setHints(0); setMistakes(0); setNoteMode(false); setBusy(false);
    }, 20);
  };
  useEffect(start, [br, bc, diff]);

  const won = !!game && !busy && vals.every((v, i) => v === game.sol[i]);
  const lost = !won && maxMistakes > 0 && mistakes >= maxMistakes;
  const missing = game ? vals.reduce((t, v, i) => t + (v !== game.sol[i] ? 1 : 0), 0) : 0;
  const auto = !!game && !won && !lost && !busy && game.puz.filter((v) => !v).length > 9 && missing > 0 && missing <= 9;
  const over = won || lost || busy || auto || showSettings;
  useEffect(() => { if (!game || over) return; const t = setInterval(() => setSecs((s) => s + 1), 1000); return () => clearInterval(t); }, [game, over]);

  useEffect(() => {
    if (!auto) return;
    const t = setTimeout(() => {
      const i = vals.findIndex((v, k) => v !== game.sol[k]);
      if (i < 0) return;
      setVals((a) => setAt(a, i, game.sol[i])); setNotes((a) => setAt(a, i, 0)); setSel(i);
    }, 350);
    return () => clearTimeout(t);
  }, [auto, vals]);

  const locked = (i) => game.puz[i] || vals[i] === game.sol[i];
  const setAt = (arr, i, v) => { const b = arr.slice(); b[i] = v; return b; };

  const enter = (v) => {
    if (!game || sel === null || over || locked(sel)) return;
    if (noteMode) { if (!vals[sel]) setNotes((a) => setAt(a, sel, a[sel] ^ (1 << v))); return; }
    if (vals[sel] === v) { setVals((a) => setAt(a, sel, 0)); return; }
    setVals((a) => setAt(a, sel, v));
    if (v === game.sol[sel]) {
      setNotes((a) => { const b = a.slice(); b[sel] = 0; eng.peers[sel].forEach((p) => { b[p] &= ~(1 << v); }); return b; });
    } else setMistakes((m) => m + 1);
  };
  const erase = () => { if (!game || sel === null || over || locked(sel)) return; setVals((a) => setAt(a, sel, 0)); setNotes((a) => setAt(a, sel, 0)); };
  const hint = () => {
    if (!game || over) return;
    const i = sel !== null && !locked(sel) ? sel : vals.findIndex((v, k) => v !== game.sol[k]);
    if (i < 0) return;
    setVals((a) => setAt(a, i, game.sol[i])); setNotes((a) => setAt(a, i, 0));
    setSel(i); setHints((h) => h + 1);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (!game || showSettings || e.target.tagName === "SELECT") return;
      const n = game.cfg.n;
      if (/^[1-9]$/.test(e.key) && +e.key <= n) enter(+e.key);
      else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") erase();
      else if (e.key === "n" || e.key === "N") setNoteMode((m) => !m);
      else if (e.key.startsWith("Arrow")) {
        e.preventDefault();
        setSel((s) => { if (s === null) return 0; let r = Math.floor(s / n), c = s % n;
          if (e.key === "ArrowUp") r = (r + n - 1) % n; if (e.key === "ArrowDown") r = (r + 1) % n;
          if (e.key === "ArrowLeft") c = (c + n - 1) % n; if (e.key === "ArrowRight") c = (c + 1) % n;
          return r * n + c; });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const n = br * bc;
  const header = (
    <div>
      <div className="top"><h1>Sudoku</h1><button className="gear" aria-label="Settings" onClick={() => setShowSettings(true)}>⚙︎</button></div>
      <div className="bar">
        <label className="field">Box
          <select value={br} onChange={(e) => setBr(+e.target.value)} aria-label="Box rows">
            {BR_OPTS.map((o) => <option key={o} value={o} disabled={o * bc > MAX_N}>{o}</option>)}
          </select>
          ×
          <select value={bc} onChange={(e) => setBc(+e.target.value)} aria-label="Box columns">
            {BC_OPTS.map((o) => <option key={o} value={o} disabled={br * o > MAX_N}>{o}</option>)}
          </select>
          <span style={{ color: "var(--muted)" }}>= {n}×{n} grid</span>
        </label>
        <div className="seg right" role="group" aria-label="Difficulty">
          {DIFFS.map((d, i) => <button key={d} aria-pressed={diff === i} onClick={() => setDiff(i)}>{d}</button>)}
        </div>
      </div>
      <div className="bar">
        <span className={"lives" + (maxMistakes && mistakes >= maxMistakes - 1 ? " warn" : "")} aria-live="polite">
          Mistakes {mistakes}{maxMistakes ? "/" + maxMistakes : ""}
        </span>
        <span className="lives">Left {missing}</span>
        <span className="time">{fmt(secs)}</span>
      </div>
    </div>
  );

  if (showSettings) return (
    <div>
      <div className="top"><h1>Settings</h1><button className="gear" aria-label="Close settings" onClick={() => setShowSettings(false)}>✕</button></div>
      <div className="msg" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <label className="field" htmlFor="mm">Max mistakes</label>
        <select id="mm" value={maxMistakes} onChange={(e) => setMaxMistakes(+e.target.value)}>
          {LIMITS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
        </select>
      </div>
      <p className="hint">The game ends when you reach this many wrong numbers. Changes apply to the game in progress too.</p>
      <div className="tools"><button onClick={() => setShowSettings(false)}>Back to game</button></div>
    </div>
  );

  if (!game || game.cfg.n !== n && busy && !vals.length) return <div>{header}<div className="board busy" style={{ "--n": n }}>Generating…</div></div>;

  const cfg = game.cfg, N = cfg.n;
  const selVal = sel !== null ? vals[sel] : 0;
  const counts = Array(N + 1).fill(0); vals.forEach((v, i) => { if (v && v === game.sol[i]) counts[v]++; });
  const nc = Math.ceil(Math.sqrt(N));

  return (
    <div>
      {header}
      {busy ? <div className="board busy" style={{ "--n": N }}>Generating…</div> : (
      <div className={"board" + (won ? " won" : "")} role="grid" style={{ "--n": N, "--nc": nc, gridTemplateColumns: `repeat(${N}, 1fr)`, gridTemplateRows: `repeat(${N}, 1fr)` }}>
        {vals.map((v, i) => {
          const r = Math.floor(i / N), c = i % N;
          const cls = ["cell"];
          if (game.puz[i]) cls.push("given");
          if (sel !== null) { if (i === sel) cls.push("sel"); else if (v && v === selVal) cls.push("same"); else if (eng.peers[sel].includes(i)) cls.push("peer"); }
          if (v && v !== game.sol[i]) cls.push("bad");
          if ((c + 1) % cfg.bc === 0 && c < N - 1) cls.push("rb");
          if ((r + 1) % cfg.br === 0 && r < N - 1) cls.push("bb");
          return (
            <button key={i} className={cls.join(" ")} onClick={() => setSel(i)} aria-label={`Row ${r + 1}, column ${c + 1}, ${v || "empty"}`}>
              {v ? v : (noteMode || notes[i]) ? (
                <div className="notes" style={{ gridTemplateColumns: `repeat(${nc}, 1fr)` }}>
                  {range(N).map((k) => {
                    const on = notes[i] & (1 << (k + 1));
                    return <span key={k} className={on ? "on" : ""} style={!noteMode && !on ? { visibility: "hidden" } : null}>{k + 1}</span>;
                  })}
                </div>
              ) : null}
            </button>
          );
        })}
      </div>)}

      <div className="pad" style={{ gridTemplateColumns: `repeat(${N > 9 ? Math.ceil(N / 2) : N}, 1fr)` }}>
        {range(N).map((k) => k + 1).map((v) => (
          <button key={v} onClick={() => enter(v)} disabled={over || counts[v] >= N}>{v}</button>
        ))}
      </div>
      <div className="tools">
        <button aria-pressed={noteMode} onClick={() => setNoteMode((m) => !m)}>Notes {noteMode ? "on" : "off"}</button>
        <button onClick={erase}>Erase</button>
        <button onClick={hint}>Hint</button>
        <button onClick={start}>New game</button>
      </div>
      {won && <div className="msg" role="status">Solved in {fmt(secs)} with {mistakes} mistake{mistakes === 1 ? "" : "s"}{hints ? " and " + hints + " hint" + (hints > 1 ? "s" : "") : ""}. Start a new game to play again.</div>}
      {auto && <div className="msg" role="status">Only {missing} left: filling them in automatically…</div>}
      {lost && <div className="msg lost" role="status">Game over: you reached {maxMistakes} mistake{maxMistakes > 1 ? "s" : ""}. Start a new game, or raise the mistake limit to keep playing this one.</div>}
      <p className="hint">Tap a cell, then a number. When only 9 cells are left, the game fills them in for you. Wrong numbers turn red and count as a mistake. With Notes on, empty cells show micro numbers and tapping a number marks it in bold instead of placing it. Keyboard: 1–{Math.min(N, 9)} to fill, arrows to move, Backspace to erase, N for notes.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
